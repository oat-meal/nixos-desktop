# kohya sd-scripts — SDXL LoRA (anime style) on Illustrious, tuned for gfx1151/ROCm.
# Training args only; resolution/bucketing/dataset live in dataset.toml.
# Starting point — tune network_dim / lr / epochs after the first run if needed.

pretrained_model_name_or_path = "/base/Illustrious-XL-v1.0.safetensors"
output_dir = "/data/output"
output_name = "oatstyle"
save_model_as = "safetensors"
save_precision = "bf16"
mixed_precision = "bf16"

# LoRA network
network_module = "networks.lora"
network_dim = 32       # rank; 16-32 typical for a style
network_alpha = 16

# Optimizer — AdamW (NOT 8-bit: bitsandbytes doesn't work on ROCm). Memory is plenty.
optimizer_type = "AdamW"
learning_rate = 1e-4
unet_lr = 1e-4
text_encoder_lr = 5e-5
lr_scheduler = "cosine_with_restarts"
lr_warmup_steps = 100

# Schedule — using the full ~6.3k-image set, so 1 epoch ≈ 3k steps (the right amount
# for a style LoRA). If you switch to a small curated set instead, raise epochs so
# total steps stay ~1500-4000 (e.g. 800 imgs -> ~5 epochs).
max_train_epochs = 1
train_batch_size = 2
save_every_n_steps = 400         # intermediate LoRAs so you can compare strengths

# Memory / AMD-safe attention
# gradient_checkpointing OFF: its backward-recompute path can hang the first step on
# gfx1151/ROCm. We have ~62 GB GTT, so the extra activation memory is fine.
gradient_checkpointing = false
cache_latents = true
cache_latents_to_disk = true
sdpa = true                       # scaled-dot-product attn (no xformers on ROCm)

max_data_loader_n_workers = 0     # no forked workers (avoid HIP fork deadlocks)
seed = 42
logging_dir = "/data/logs"
